server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # L'API : même origine que le front => aucun problème de CORS en production
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Application React : toute autre URL renvoie index.html (le routeur prend le relais)
    location / {
        try_files $uri /index.html;
    }
}
