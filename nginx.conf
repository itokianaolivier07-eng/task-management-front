server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # L'API : même origine que le front => aucun problème de CORS en production
    location /api/ {
        proxy_pass http://api:8080;
        # $http_host garde le port (ex. localhost:3000) : le back voit une requête "même origine".
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Adresse réelle du visiteur (utile à la limitation de tentatives du back).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application React : toute autre URL renvoie index.html (le routeur prend le relais)
    location / {
        try_files $uri /index.html;
    }
}
